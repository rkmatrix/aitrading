# Phase 27 — Micro Allocator (Moderate profile)
#
# PURPOSE: Controls position sizing and filters out weak signals before allocation.
#
# ADJUSTMENT GUIDE:
#   - Lower signal_floor = More trades (more sensitive to signals)
#   - Higher signal_floor = Fewer trades (only strong signals)
#   - Adjust based on your risk tolerance and market conditions

profile: "moderate"

# signal_floor: Minimum absolute fused score to consider for trading
#   - Range: 0.01 - 0.20
#   - Default: 0.05 (5% signal strength)
#   - MEANING: Signals with abs(fused_score) < signal_floor are ignored
#   - Lower to 0.02-0.03 for more trades, raise to 0.08-0.10 for stronger signals only
#   - This is the PRIMARY filter preventing weak signals from becoming trades
signal_floor: 0.05       # abs(fused) below this → no trade

# If the desired change in weight is small, skip to avoid churn
rebalance_band: 0.01     # 1% of equity

# Max/min exposure per symbol
max_weight: 0.20         # 20% of equity per symbol (LIVE/PAPER)
min_weight: 0.01         # At least 1% when we decide to have exposure

# DEMO mode can be more aggressive if you want
demo_max_weight: 0.40    # 40% of equity per symbol in DEMO

# Volatility scaling
vol_floor: 0.5           # below = very low vol → scale up
vol_ceiling: 2.5         # above = high vol → scale down

# Round quantities to nearest N shares
qty_rounding: 1
